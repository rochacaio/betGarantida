services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: betgarantida
      POSTGRES_PASSWORD: betgarantida
      POSTGRES_DB: betgarantida_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betgarantida -d betgarantida_test"]
      interval: 2s
      timeout: 2s
      retries: 20
